    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HRHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>HRHub | Operations &amp; Executive Hub</title>
    <script defer src="/mediapipe/selfie_segmentation.js"></script>
    <script>
      (function startMarqueeTitle() {
        var baseTitle = "HRHub | Operations & Executive Hub • Simpal Group of Companies • ";
        var titleText = baseTitle;
        setInterval(function() {
          titleText = titleText.substring(1) + titleText.substring(0, 1);
          document.title = titleText;
        }, 220);
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[HRHub PWA] Service Worker registered successfully:', reg.scope);
          }).catch(function(err) {
            console.warn('[HRHub PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
