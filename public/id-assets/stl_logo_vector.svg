<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="200" height="230">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E9E" />
      <stop offset="100%" stop-color="#113673" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC50E" />
      <stop offset="100%" stop-color="#EAA000" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E01A22" />
      <stop offset="100%" stop-color="#BA0C14" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- BLUE HOOK (TOP-LEFT 'S' / 'C' SHAPE) -->
    <path d="
      M 26,10
      L 80,10
      C 85,10 88,14 88,19
      L 88,27
      C 88,28 87,29 86,29
      L 29,29
      C 27.5,29 27,30 27,31.5
      L 27,61
      C 27,65 24,68 20,68
      C 15,68 12,65 12,60
      L 12,24
      C 12,16 18,10 26,10
      Z
    " fill="url(#blueGrad)" />

    <!-- YELLOW HOOK (MIDDLE-RIGHT INTERLOCKING SHAPE) -->
    <path d="
      M 37,34
      C 37,32.5 38.5,31 40,31
      L 77,31
      C 84,31 88,36 88,43
      L 88,67
      C 88,71.5 84.5,75 80,75
      C 75.5,75 72,71.5 72,67
      L 72,49
      C 72,47 70,45 68,45
      L 39,45
      C 37.5,45 37,44 37,42
      Z
    " fill="url(#yellowGrad)" />

    <!-- RED STEM & BASE (BOTTOM 'T' SHAPE) -->
    <!-- Center Vertical Stem -->
    <path d="
      M 43,44
      C 43,42 44.5,41 46,41
      L 56,41
      C 57.5,41 59,42 59,44
      L 59,85
      L 43,85
      Z
    " fill="url(#redGrad)" />

    <!-- Bottom Horizontal Bar with pill caps -->
    <rect x="12" y="80" width="76" height="17" rx="8.5" ry="8.5" fill="url(#redGrad)" />
  </g>
</svg>
